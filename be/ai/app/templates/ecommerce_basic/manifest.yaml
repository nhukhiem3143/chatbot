# Quyền sửa source website CON (outputs/run_N): AI được sửa cả FE, BE, API, context.
# Chỉ giữ vùng bảo vệ cho bí mật, Docker host/infra và SQL khởi tạo không đảo ngược.
name: ecommerce_basic
description: Web bán hàng React/Vite + Node/Express + MySQL

locked:
  - .env
  - '**/.env'
  - '**/.env.*'
  - '**/*secret*'
  - '**/*private*key*'
  - docker-compose.yml
  - db/Dockerfile
  - db/01_init.sql
  - api/Dockerfile
  - web/Dockerfile
  - web/nginx.conf

editable:
  - api/**
  - web/**
  - db/02_extra.sql
  - db/03_seed.sql
